!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bol Kisan</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f2f2}
.top{background:#1A7A2E;color:#fff;text-align:center;padding:18px 10px;border-radius:0 0 20px 20px}
.top h1{margin:0;font-size:32px}.top p{margin:5px 0 0;font-size:17px}
.card{background:#fff;margin:15px;border-radius:20px;padding:18px;box-shadow:0 2px 10px #ccc}
.card p{font-size:20px;font-weight:bold;margin:12px 0 5px}
select{width:100%;padding:15px;font-size:19px;border:2px solid #ddd;border-radius:12px;background:#f9f9f9}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick button{flex:1;padding:12px;font-size:17px;font-weight:bold;border:1px solid #ddd;border-radius:25px;background:#fff}
.quick .on{background:#1A7A2E;color:#fff}
.btn{width:92%;margin:10px 4%;padding:18px;font-size:22px;font-weight:bold;color:#fff;border:none;border-radius:15px}
.orange{background:#FF7A00}.green{background:#1A7A2E}.red{background:#D32F2F}
#result{background:#fff;margin:15px;border-radius:20px;padding:18px;text-align:center;font-size:22px;font-weight:bold;min-height:70px}
#sun{ text-align:center;font-size:18px;color:#555}
</style></head><body>
<div class="top"><h1>🌾 Bol Kisan</h1><p>🎤 Pehle Aap Bolo • 🔊 Phir Ye Bolega</p></div>
<div class="card">
<p>📍 Rajya</p><select id="state" onchange="loadMandi()"><option>Bihar</option><option>Uttar Pradesh</option><option>Madhya Pradesh</option></select>
<p>🏪 Mandi</p><select id="mandi"></select>
<p>🌽 Fasal</p><select id="crop" onchange="setCrop(this.value)"><option>Makka</option><option>Gehu</option><option>Dhan</option><option>Aloo</option><option>Sarso</option></select>
<div class="quick">
<button onclick="setCrop('Makka',this)">Makka</button><button onclick="setCrop('Gehu',this)">Gehu</button><button onclick="setCrop('Dhan',this)">Dhan</button><button onclick="setCrop('Aloo',this)">Aloo</button><button onclick="setCrop('Sarso',this)">Sarso</button>
</div></div>
<button class="btn orange" onclick="startApp()">🎤 MAI BOLUNGA</button>
<button class="btn green" onclick="speakBhav()">🔊 BHAV BATAO</button>
<button class="btn red" onclick="chup()">✋ CHUP HO JAO</button>
<div id="result">Bhav yaha aayega</div>
<div id="sun">Dabao aur Bolo - "Makka ke bhav kitna hai?"</div>
<script>
var mandis={"Bihar":["Patna","Gulab Bagh","Hajipur","Muzaffarpur"],"Uttar Pradesh":["Kanpur","Lucknow","Agra"],"Madhya Pradesh":["Indore","Bhopal","Ujjain"]};
var bhav={"Makka":2250,"Gehu":2425,"Dhan":2300,"Aloo":1200,"Sarso":5650};
function loadMandi(){var s=document.getElementById("state").value;var m=document.getElementById("mandi");m.innerHTML="";mandis[s].forEach(function(x){m.innerHTML+="<option>"+x+"</option>"})}loadMandi();
function setCrop(c,btn){document.getElementById("crop").value=c;if(btn){document.querySelectorAll(".quick button").forEach(function(b){b.classList.remove("on")});btn.classList.add("on")}}
function bol(text){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang="hi-IN";u.rate=0.9;speechSynthesis.speak(u)}
function speakBhav(){var c=document.getElementById("crop").value;var m=document.getElementById("mandi").value;var p=bhav[c]||2000;var t=c+" ka bhav "+m+" mandi me "+p+" rupaye kuntal hai.";document.getElementById("result").innerText=t;bol(t)}
function chup(){speechSynthesis.cancel();if(window.rec&&window.rec.stop){try{window.rec.stop()}catch(e){}}document.getElementById("sun").innerText="Chup ho gaya.";document.getElementById("result").innerText="Chup ho gaya."}
function startApp(){document.getElementById("sun").innerText="Sun raha hu... Bolo";var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Chrome me kholo");return}var rec=new SR();window.rec=rec;rec.lang="hi-IN";rec.onresult=function(e){var t=e.results[0][0].transcript;document.getElementById("sun").innerText="Tumne bola: "+t;["Makka","Gehu","Dhan","Aloo","Sarso"].forEach(function(f){if(t.toLowerCase().includes(f.toLowerCase())){setCrop(f)}});setTimeout(speakBhav,600)};rec.start()}
</script></body></html>
